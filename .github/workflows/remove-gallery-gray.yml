name: Remove gallery placeholders

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix-gallery:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Remove empty gallery section and restore page background
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          # Remove the gallery block whose local image files are missing.
          pattern = r'\s*<section id="gallery" class="gallery container">.*?</section>'
          s, count = re.subn(pattern, '', s, count=1, flags=re.S)
          print('Removed empty gallery section.' if count else 'Gallery section was not found.')

          # Restore the soft salon-photo background while keeping the empty gallery removed.
          old = 'background-image: none;'
          new = "background-image: linear-gradient(135deg, rgba(252, 251, 250, 0.9) 0%, rgba(244, 238, 230, 0.85) 100%), url('https://images.unsplash.com/photo-1560066984-138dadb4c035?auto=format&fit=crop&q=80&w=1920');"
          if old in s:
              s = s.replace(old, new, 1)

          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Restore page background and remove empty gallery"
          git push
