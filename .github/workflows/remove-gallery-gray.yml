name: Remove gallery placeholders

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix-gallery:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Remove empty gallery section
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          # The gallery currently points to image files that are not present.
          # Remove the entire empty gallery section so it leaves no blank space.
          pattern = r'\s*<section id="gallery" class="gallery container">.*?</section>'
          s, count = re.subn(pattern, '', s, count=1, flags=re.S)
          if count:
              print('Removed empty gallery section.')
          else:
              print('Gallery section was not found; no section removed.')

          # Keep the page background plain and prevent a large decorative image.
          s = re.sub(
              r'background-image\s*:\s*linear-gradient\([^;]*\)\s*,\s*url\([^;]*\)\s*;',
              'background-image: none;',
              s,
              count=1
          )

          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Remove empty gallery section"
          git push
