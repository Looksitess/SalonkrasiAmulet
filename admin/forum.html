<style>
:root{--bg:#faf8f4;--card:#fffefd;--text:#302c27;--muted:#81796f;--line:#e9e2d8;--red:#b42318;--green:#177245;--blue:#29445f}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px Arial,sans-serif;line-height:1.5}.container{max-width:1150px;margin:auto;padding:20px}.panel,.topic,.reply{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:18px;margin-bottom:14px}.header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}.muted{color:var(--muted)}button,.button{border:0;border-radius:9px;padding:10px 14px;background:var(--blue);color:#fff;font-weight:700;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}.soft{background:#f0e9de;color:var(--text)}.danger{background:var(--red)}.green{background:var(--green)}.actions{display:flex;gap:8px;flex-wrap:wrap}.filters{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:10px}.filters input,.filters select,.login input{display:block;width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--text);font:inherit}.filter-row{display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin-top:12px}.check{display:flex;gap:7px;align-items:center;font-weight:600;font-size:13px}.check input{width:17px;height:17px}.topic h3{margin:7px 0;font-size:19px}.meta{font-size:12px;color:var(--muted);margin:5px 0 12px}.body{white-space:pre-wrap;overflow-wrap:anywhere;margin:8px 0 14px}.badge{display:inline-block;border-radius:999px;padding:4px 9px;background:#f0e9de;font-size:12px}.badge.hidden{background:#ffe4e2;color:#9b1c14}.reply{margin:9px 0 0;padding:13px;background:#faf8f4}.reply p{white-space:pre-wrap;margin:6px 0}.login{max-width:420px;margin:8vh auto;background:#fff;padding:26px;border-radius:16px}.login input{margin:7px 0 12px}.message{padding:10px;border-radius:9px;margin:12px 0}.ok{background:#e8f5ec;color:var(--green)}.err{background:#fff0ef;color:var(--red)}.empty{text-align:center;padding:24px;color:var(--muted);background:#fff;border-radius:12px}.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}.stat{padding:12px;border:1px solid var(--line);border-radius:12px;background:#fff}.stat strong{display:block;font-size:22px}.pager{display:flex;justify-content:center;align-items:center;gap:12px;flex-wrap:wrap;margin:18px}.pager span{font-size:13px;color:var(--muted)}

<body>
<div id="login" class="login" style="display:none"><h1>Модерація форуму</h1><p class="muted">Увійдіть під адміністраторським акаунтом.</p><label>Email</label><input id="email" type="email" autocomplete="username"><label>Пароль</label><input id="password" type="password" autocomplete="current-password"><button style="width:100%" onclick="login()">Увійти</button><div id="loginError"></div></div>
<div id="app" style="display:none"><div class="container">
<div class="header"><div><h1 style="margin:0">Модерація форуму</h1><div class="muted">Пошук, фільтри, керування темами й відповідями.</div></div><div class="actions"><a class="button soft" href="./index.html">До записів та відгуків</a><a class="button soft" href="../forum.html" target="_blank" rel="noopener">Відкрити форум</a><button class="soft" onclick="loadTopics()">Оновити</button><button class="danger" onclick="logout()">Вийти</button></div></div>
<div id="message"></div>
<div class="summary"><div class="stat"><strong id="allCount">0</strong><span class="muted">Усього тем</span></div><div class="stat"><strong id="publishedCount">0</strong><span class="muted">Опубліковано</span></div><div class="stat"><strong id="hiddenCount">0</strong><span class="muted">Приховано</span></div><div class="stat"><strong id="replyCount">0</strong><span class="muted">Відповідей</span></div></div>
<section class="panel"><h2 style="margin-top:0">Фільтри модерації</h2><div class="filters">
<div class="search"><label for="search">Пошук за темою, текстом або автором</label><input id="search" type="search" placeholder="Введіть слова для пошуку…"></div>
<div><label for="category">Категорія</label><select id="category"><option value="">Усі категорії</option><option>Загальне</option><option>Догляд і краса</option><option>Питання майстрам</option><option>Манікюр і педикюр</option><option>Волосся</option></select></div>
<div><label for="status">Статус теми</label><select id="status"><option value="">Усі</option><option value="published">Опубліковані</option><option value="hidden">Приховані</option></select></div>
<div><label for="sort">Сортування</label><select id="sort"><option value="newest">Спочатку нові</option><option value="oldest">Спочатку старі</option><option value="popular">Найбільше відповідей</option><option value="active">Остання активність</option></select></div>
</div><div class="filter-row"><label class="check"><input id="lockedOnly" type="checkbox"> Лише закриті</label><label class="check"><input id="withReplies" type="checkbox"> Є відповіді</label><label class="check"><input id="withoutReplies" type="checkbox"> Без відповідей</label><button class="soft" onclick="resetFilters()">Скинути</button><span class="muted" id="resultCount"></span></div></section>
<div id="topics"><div class="empty">Завантаження…</div></div><div class="pager" id="pager"></div>
</div></div>
<script>
const SUPABASE_URL="https://hqbjlvryecmqemmajqyo.supabase.co";
const SUPABASE_KEY="sb_publishable_o4SMwGNId-e5tqfTSrKWfQ_f2Ftn5j7";
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const PAGE_SIZE=15;
let session=null,allTopics=[],allPosts=[],postsByTopic={},page=1,searchTimer=null,loading=false;
function esc(v){return String(v??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;")}
function message(text,ok){document.getElementById("message").innerHTML=text?'<div class="message '+(ok?"ok":"err")+'">'+esc(text)+'</div>':""}
function loginError(text){const e=document.getElementById("loginError");e.className=text?"message err":"";e.textContent=text||""}
async function route(){const s=await db.auth.getSession();session=s.data.session||null;if(!session){document.getElementById("login").style.display="block";return}const p=await db.from("profiles").select("id,role,is_admin,active").eq("id",session.user.id).maybeSingle();if(p.error||!p.data||!p.data.active||!(p.data.is_admin||p.data.role==="admin")){await db.auth.signOut();document.getElementById("login").style.display="block";loginError("Доступ дозволено лише активному адміністратору.");return}document.getElementById("login").style.display="none";document.getElementById("app").style.display="block";await loadTopics()}
async function login(){loginError("");const email=document.getElementById("email").value.trim(),password=document.getElementById("password").value;if(!email||!password){loginError("Введіть email і пароль.");return}const r=await db.auth.signInWithPassword({email,password});if(r.error){loginError("Не вдалося увійти: "+r.error.message);return}await route()}
async function logout(){await db.auth.signOut();location.reload()}
async function loadTopics(){if(loading)return;loading=true;const box=document.getElementById("topics");box.innerHTML='<div class="empty">Завантаження даних…</div>';try{const r=await db.from("forum_topics").select("id,title,category,body,author_name,created_at,updated_at,is_locked,status").order("updated_at",{ascending:false}).limit(1000);if(r.error)throw r.error;allTopics=r.data||[];const ids=allTopics.map(t=>t.id);if(ids.length){const pr=await db.from("forum_posts").select("id,topic_id,author_name,body,created_at,status").in("topic_id",ids).order("created_at",{ascending:false}).limit(3000);if(pr.error)throw pr.error;allPosts=pr.data||[]}else allPosts=[];postsByTopic={};allPosts.forEach(p=>{if(!postsByTopic[p.topic_id])postsByTopic[p.topic_id]=[];postsByTopic[p.topic_id].push(p)});document.getElementById("allCount").textContent=allTopics.length;document.getElementById("publishedCount").textContent=allTopics.filter(t=>t.status==="published").length;document.getElementById("hiddenCount").textContent=allTopics.filter(t=>t.status==="hidden").length;document.getElementById("replyCount").textContent=allPosts.length;page=1;renderTopics()}catch(e){box.innerHTML='<div class="empty">Не вдалося завантажити теми: '+esc(e.message)+'</div>'}finally{loading=false}}
function filteredTopics(){const term=document.getElementById("search").value.trim().toLocaleLowerCase("uk-UA"),cat=document.getElementById("category").value,status=document.getElementById("status").value,locked=document.getElementById("lockedOnly").checked,withReplies=document.getElementById("withReplies").checked,withoutReplies=document.getElementById("withoutReplies").checked;const rows=allTopics.filter(t=>{const posts=postsByTopic[t.id]||[],searchMatch=!term||[t.title,t.body,t.author_name,...posts.map(p=>p.body),...posts.map(p=>p.author_name)].some(v=>String(v||"").toLocaleLowerCase("uk-UA").includes(term));return searchMatch&&(!cat||t.category===cat)&&(!status||t.status===status)&&(!locked||t.is_locked)&&(!withReplies||posts.length>0)&&(!withoutReplies||posts.length===0)});const sort=document.getElementById("sort").value;if(sort==="oldest")rows.sort((a,b)=>new Date(a.created_at)-new Date(b.created_at));else if(sort==="popular")rows.sort((a,b)=>(postsByTopic[b.id]||[]).length-(postsByTopic[a.id]||[]).length);else if(sort==="newest")rows.sort((a,b)=>new Date(b.created_at)-new Date(a.created_at));else rows.sort((a,b)=>new Date(b.updated_at)-new Date(a.updated_at));return rows}
function renderTopics(){const box=document.getElementById("topics"),rows=filteredTopics();document.getElementById("resultCount").textContent="Знайдено: "+rows.length;const pages=Math.max(1,Math.ceil(rows.length/PAGE_SIZE));if(page>pages)page=pages;const visible=rows.slice((page-1)*PAGE_SIZE,page*PAGE_SIZE);if(!visible.length){box.innerHTML='<div class="empty">За цими умовами нічого не знайдено.</div>';renderPager(pages);return}box.innerHTML=visible.map(t=>{const posts=postsByTopic[t.id]||[];return '<article class="topic"><div class="header"><div><span class="badge '+(t.status==="hidden"?"hidden":"")+'">'+(t.status==="hidden"?"Прихована":"Опублікована")+'</span> <span class="badge">'+(t.is_locked?"Закрита":"Відкрита")+'</span> <span class="badge">'+esc(t.category)+'</span><h3>'+esc(t.title)+'</h3><div class="meta">Автор: '+esc(t.author_name)+' · '+new Date(t.created_at).toLocaleString("uk-UA")+' · Відповідей: '+posts.length+'</div></div></div><div class="body">'+esc(t.body)+'</div><div class="actions">'+(t.status==="published"?'<button class="soft" onclick="setTopicStatus(\''+t.id+'\',\'hidden\')">Приховати тему</button>':'<button class="green" onclick="setTopicStatus(\''+t.id+'\',\'published\')">Опублікувати тему</button>')+'<button class="soft" onclick="toggleLock(\''+t.id+'\','+(!t.is_locked)+')">'+(t.is_locked?"Відкрити відповіді":"Закрити відповіді")+'</button><button class="danger" onclick="deleteTopic(\''+t.id+'\')">Видалити тему</button></div><details style="margin-top:14px"><summary style="cursor:pointer;font-weight:700">Відповіді ('+posts.length+')</summary>'+(posts.length?posts.map(p=>'<div class="reply"><div><strong>'+esc(p.author_name)+'</strong> <span class="meta">'+new Date(p.created_at).toLocaleString("uk-UA")+'</span> <span class="badge '+(p.status==="hidden"?"hidden":"")+'">'+(p.status==="hidden"?"Прихована":"Опублікована")+'</span></div><p>'+esc(p.body)+'</p><div class="actions">'+(p.status==="published"?'<button class="soft" onclick="setPostStatus(\''+p.id+'\',\'hidden\')">Приховати відповідь</button>':'<button class="green" onclick="setPostStatus(\''+p.id+'\',\'published\')">Показати відповідь</button>')+'<button class="danger" onclick="deletePost(\''+p.id+'\')">Видалити відповідь</button></div></div>').join(""):'<p class="muted">Відповідей поки немає.</p>')+'</details></article>'}).join("");renderPager(pages)}
function renderPager(total){const p=document.getElementById("pager");if(total<=1){p.innerHTML="";return}p.innerHTML='<button class="soft" '+(page===1?'disabled':'')+' onclick="changePage(-1)">← Назад</button><span>Сторінка '+page+' з '+total+'</span><button class="soft" '+(page===total?'disabled':'')+' onclick="changePage(1)">Далі →</button>'}
function changePage(d){page=Math.max(1,page+d);renderTopics();window.scrollTo({top:0,behavior:"smooth"})}
function resetFilters(){document.getElementById("search").value="";document.getElementById("category").value="";document.getElementById("status").value="";document.getElementById("sort").value="newest";document.getElementById("lockedOnly").checked=false;document.getElementById("withReplies").checked=false;document.getElementById("withoutReplies").checked=false;page=1;renderTopics()}
function filterChanged(){page=1;renderTopics()}
async function setTopicStatus(id,status){const r=await db.from("forum_topics").update({status}).eq("id",id);if(r.error){message("Не вдалося змінити статус: "+r.error.message,false);return}message(status==="hidden"?"Тему приховано.":"Тему опубліковано.",true);await loadTopics()}
async function toggleLock(id,locked){const r=await db.from("forum_topics").update({is_locked:locked}).eq("id",id);if(r.error){message("Не вдалося змінити стан теми: "+r.error.message,false);return}message(locked?"Відповіді до теми закрито.":"Відповіді знову дозволені.",true);await loadTopics()}
async function deleteTopic(id){if(!confirm("Видалити тему разом з усіма відповідями? Цю дію не можна скасувати."))return;const r=await db.from("forum_topics").delete().eq("id",id);if(r.error){message("Не вдалося видалити тему: "+r.error.message,false);return}message("Тему та її відповіді видалено.",true);await loadTopics()}
async function setPostStatus(id,status){const r=await db.from("forum_posts").update({status}).eq("id",id);if(r.error){message("Не вдалося змінити відповідь: "+r.error.message,false);return}message(status==="hidden"?"Відповідь приховано.":"Відповідь опубліковано.",true);await loadTopics()}
async function deletePost(id){if(!confirm("Видалити цю відповідь?"))return;const r=await db.from("forum_posts").delete().eq("id",id);if(r.error){message("Не вдалося видалити відповідь: "+r.error.message,false);return}message("Відповідь видалено.",true);await loadTopics()}
["category","status","sort","lockedOnly","withReplies","withoutReplies"].forEach(id=>document.getElementById(id).addEventListener("change",filterChanged));
document.getElementById("search").addEventListener("input",()=>{clearTimeout(searchTimer);searchTimer=setTimeout(filterChanged,200)});
route();
</script>
