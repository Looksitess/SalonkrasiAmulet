plugins {
    id 'com.android.application'
}

android {
    namespace 'com.looksitess.amuletadmin'
    compileSdk 35

    defaultConfig {
        applicationId 'com.looksitess.amuletadmin'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
    }

    signingConfigs {
        release {
            def keystorePath = System.getenv('AMULET_KEYSTORE_PATH')
            def keystorePassword = System.getenv('AMULET_KEYSTORE_PASSWORD')
            def keyAliasValue = System.getenv('AMULET_KEY_ALIAS')
            def keyPasswordValue = System.getenv('AMULET_KEY_PASSWORD')
            if (keystorePath && keystorePassword && keyAliasValue && keyPasswordValue) {
                storeFile file(keystorePath)
                storePassword keystorePassword
                keyAlias keyAliasValue
                keyPassword keyPasswordValue
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}
