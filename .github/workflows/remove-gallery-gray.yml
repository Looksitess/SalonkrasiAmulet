name: Remove gallery placeholders

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix-gallery:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Clean gallery background
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          # Remove the large salon interior image from the page background.
          old_body = "background-image: linear-gradient(135deg, rgba(252, 251, 250, 0.9) 0%, rgba(244, 238, 230, 0.85) 100%), url('https://images.unsplash.com/photo-1560066984-138dadb4c035?auto=format&fit=crop&q=80&w=1920');"
          if old_body in s:
              s = s.replace(old_body, "background-image: none;", 1)

          # Keep the gallery clean instead of showing a large background through it.
          old_gallery = '.gallery{padding:50px 0}'
          new_gallery = '.gallery{padding:50px 0;background:#fcfbfa}'
          if old_gallery in s:
              s = s.replace(old_gallery, new_gallery, 1)

          old_card = '.gallery-item{position:relative;overflow:hidden;border-radius:18px;box-shadow:var(--shadow);background:#ddd}'
          new_card = '.gallery-item{position:relative;overflow:hidden;border-radius:18px;box-shadow:none;background:transparent}'
          if old_card in s:
              s = s.replace(old_card, new_card, 1)

          old_img = '.gallery-item img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .7s ease}'
          new_img = '.gallery-item img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .7s ease;color:transparent}'
          if old_img in s:
              s = s.replace(old_img, new_img, 1)

          marker = '</body>'
          script = '''<script>
          document.querySelectorAll('.gallery-item img').forEach(function(img){
            img.addEventListener('error', function(){
              var item = img.closest('.gallery-item');
              if (item) item.remove();
            });
          });
          </script>\n'''
          if script not in s and marker in s:
              s = s.replace(marker, script + marker, 1)

          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Remove large gallery background"
          git push
