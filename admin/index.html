<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Амулет — Адмін-панель</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f1eb;
      color: #29241f;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 24px;
    }

    .login {
      max-width: 430px;
      margin: 70px auto;
      background: white;
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 10px 35px rgba(0,0,0,.08);
    }

    h1 {
      margin: 0 0 8px;
    }

    .subtitle {
      color: #777;
      margin-bottom: 25px;
    }

    input,
    select {
      width: 100%;
      padding: 13px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 16px;
      background: white;
    }

    input {
      margin-bottom: 12px;
    }

    button {
      border: 0;
      border-radius: 10px;
      padding: 12px 18px;
      font-size: 15px;
      cursor: pointer;
    }

    .login button {
      width: 100%;
      background: #9b7a50;
      color: white;
    }

    .error {
      color: #b42318;
      margin-top: 12px;
    }

    .success {
      color: #16803c;
      margin-top: 12px;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      margin-bottom: 25px;
    }

    .actions {
      display: flex;
      gap: 10px;
    }

    .refresh {
      background: #9b7a50;
      color: white;
    }

    .logout {
      background: #29241f;
      color: white;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 15px;
      margin-bottom: 25px;
    }

    .stat {
      background: white;
      border-radius: 15px;
      padding: 18px;
      box-shadow: 0 5px 20px rgba(0,0,0,.05);
    }

    .stat-number {
      font-size: 28px;
      font-weight: bold;
      margin-top: 8px;
    }

    .booking {
      background: white;
      border-radius: 18px;
      padding: 20px;
      margin-bottom: 15px;
      box-shadow: 0 5px 20px rgba(0,0,0,.05);
    }

    .booking-top {
      display: flex;
      justify-content: space-between;
      gap: 15px;
      align-items: flex-start;
    }

    .client {
      font-size: 20px;
      font-weight: bold;
    }

    .phone {
      margin-top: 5px;
      color: #666;
    }

    .details {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
      margin-top: 20px;
    }

    .detail {
      background: #f8f6f2;
      padding: 13px;
      border-radius: 10px;
    }

    .detail-title {
      font-size: 12px;
      color: #777;
      margin-bottom: 5px;
    }

    .comment {
      margin-top: 15px;
      padding: 13px;
      background: #faf8f5;
      border-radius: 10px;
    }

    .status {
      display: inline-block;
      padding: 7px 11px;
      border-radius: 20px;
      font-size: 13px;
      margin-bottom: 10px;
    }

    .status-new {
      background: #fff0c7;
    }

    .status-confirmed {
      background: #dff5e3;
    }

    .status-completed {
      background: #e5e7eb;
    }

    .status-cancelled {
      background: #ffe0e0;
    }

    .empty {
      background: white;
      padding: 45px;
      text-align: center;
      border-radius: 18px;
      color: #777;
    }

    .loading {
      padding: 20px;
      text-align: center;
      color: #777;
    }

    @media (max-width: 800px) {
      .stats {
        grid-template-columns: 1fr 1fr;
      }

      .details {
        grid-template-columns: 1fr;
      }

      .booking-top {
        flex-direction: column;
      }
    }

    @media (max-width: 500px) {
      .container {
        padding: 15px;
      }

      .header {
        flex-direction: column;
        align-items: flex-start;
      }

      .actions {
        width: 100%;
      }

      .actions button {
        flex: 1;
      }

      .stats {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

<!-- LOGIN -->
<div id="loginScreen" class="login">
  <h1>Адмін-панель «Амулет»</h1>

  <div class="subtitle">
    Вхід адміністратора
  </div>

  <input
    id="email"
    type="email"
    placeholder="Email"
  >

  <input
    id="password"
    type="password"
    placeholder="Пароль"
  >

  <button onclick="login()">
    Увійти
  </button>

  <div id="loginError" class="error"></div>
</div>


<!-- ADMIN -->
<div id="adminScreen" style="display:none;">

  <div class="container">

    <div class="header">

      <div>
        <h1>Заявки «Амулет»</h1>

        <div class="subtitle">
          Панель адміністратора
        </div>
      </div>

      <div class="actions">

        <button
          class="refresh"
          onclick="loadBookings()"
        >
          ↻ Оновити
        </button>

        <button
          class="logout"
          onclick="logout()"
        >
          Вийти
        </button>

      </div>

    </div>


    <!-- СТАТИСТИКА -->

    <div class="stats">

      <div class="stat">
        <div>Всього</div>
        <div
          id="totalCount"
          class="stat-number"
        >
          0
        </div>
      </div>

      <div class="stat">
        <div>Нові</div>
        <div
          id="newCount"
          class="stat-number"
        >
          0
        </div>
      </div>

      <div class="stat">
        <div>Підтверджені</div>
        <div
          id="confirmedCount"
          class="stat-number"
        >
          0
        </div>
      </div>

      <div class="stat">
        <div>Завершені</div>
        <div
          id="completedCount"
          class="stat-number"
        >
          0
        </div>
      </div>

    </div>


    <div id="message"></div>

    <div id="bookings"></div>

  </div>

</div>


<script>

const SUPABASE_URL =
  "https://hqbjlvryecmqemmajqyo.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_o4SMwGNId-e5tqfTSrKWfQ_f2Ftn5j7";


const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =========================
   ПРОВЕРКА АВТОРИЗАЦИИ
========================= */

async function checkAuth() {

  const {
    data: {
      session
    }
  } =
    await supabaseClient.auth.getSession();


  if (session) {

    showAdmin();

    loadBookings();

  } else {

    showLogin();

  }
}


/* =========================
   ПОКАЗ ЭКРАНОВ
========================= */

function showLogin() {

  document
    .getElementById("loginScreen")
    .style.display = "block";

  document
    .getElementById("adminScreen")
    .style.display = "none";
}


function showAdmin() {

  document
    .getElementById("loginScreen")
    .style.display = "none";

  document
    .getElementById("adminScreen")
    .style.display = "block";
}


/* =========================
   ВХОД
========================= */

async function login() {

  const email =
    document
      .getElementById("email")
      .value
      .trim();

  const password =
    document
      .getElementById("password")
      .value;


  const error =
    document
      .getElementById("loginError");


  error.textContent = "";


  if (!email || !password) {

    error.textContent =
      "Введіть email та пароль.";

    return;
  }


  const {
    error: authError
  } =
    await supabaseClient.auth.signInWithPassword({

      email: email,

      password: password

    });


  if (authError) {

    error.textContent =
      "Помилка входу: " +
      authError.message;

    return;
  }


  showAdmin();

  loadBookings();
}


/* =========================
   ВЫХОД
========================= */

async function logout() {

  await supabaseClient.auth.signOut();

  showLogin();
}


/* =========================
   ЗАГРУЗКА ЗАЯВОК
========================= */

async function loadBookings() {

  const box =
    document.getElementById("bookings");

  const message =
    document.getElementById("message");


  box.innerHTML =
    '<div class="loading">Завантаження заявок...</div>';

  message.textContent = "";


  const {
    data,
    error
  } =
    await supabaseClient
      .from("bookings")
      .select("*")
      .order(
        "booking_date",
        {
          ascending: false
        }
      )
      .order(
        "booking_time",
        {
          ascending: false
        }
      );


  if (error) {

    box.innerHTML =
      `<div class="empty">
        Помилка завантаження заявок:<br><br>
        ${escapeHtml(error.message)}
      </div>`;

    return;
  }


  updateStats(data);

  renderBookings(data);
}


/* =========================
   СТАТИСТИКА
========================= */

function updateStats(data) {

  document
    .getElementById("totalCount")
    .textContent =
      data.length;


  document
    .getElementById("newCount")
    .textContent =
      data.filter(
        x => x.status === "new"
      ).length;


  document
    .getElementById("confirmedCount")
    .textContent =
      data.filter(
        x => x.status === "confirmed"
      ).length;


  document
    .getElementById("completedCount")
    .textContent =
      data.filter(
        x => x.status === "completed"
      ).length;
  loadSchedule();
}
/* =========================
   РАСПИСАНИЕ
========================= */

async function loadSchedule() {

  const oldSchedule =
    document.getElementById("adminSchedule");

  if (oldSchedule) {
    oldSchedule.remove();
  }

  const box =
    document.getElementById("bookings");

  if (!box) return;

  const { data: schedule, error: scheduleError } =
    await supabaseClient
      .from("work_schedule")
      .select("*")
      .order("weekday", { ascending: true });

  if (scheduleError) {
    console.error("Ошибка расписания:", scheduleError);
    return;
  }

  const { data: bookings, error: bookingsError } =
    await supabaseClient
      .from("bookings")
      .select("booking_date, booking_time, status")
      .in("status", ["new", "confirmed"]);

  if (bookingsError) {
    console.error("Ошибка записей:", bookingsError);
    return;
  }

  const scheduleBox = document.createElement("div");

  scheduleBox.id = "adminSchedule";

  scheduleBox.style.cssText = `
    margin-top: 24px;
    padding: 20px;
    border-radius: 16px;
    background: #ffffff;
    box-shadow: 0 4px 18px rgba(0,0,0,.08);
  `;

  scheduleBox.innerHTML = `
    <h2 style="
      margin: 0 0 18px;
      font-size: 22px;
    ">
      Розклад
    </h2>
  `;

  const days = [
    "Неділя",
    "Понеділок",
    "Вівторок",
    "Середа",
    "Четвер",
    "П’ятниця",
    "Субота"
  ];

  const today = new Date();

  for (let i = 0; i < 7; i++) {

    const date = new Date(today);

    date.setDate(today.getDate() + i);

    const weekday = date.getDay();

    const dateString =
      date.toISOString().split("T")[0];

    const daySchedule =
      schedule.find(
        item => Number(item.weekday) === weekday
      );

    const dayBox = document.createElement("div");

    dayBox.style.cssText = `
      margin-bottom: 18px;
      padding: 14px;
      border: 1px solid #e5e5e5;
      border-radius: 12px;
    `;

    const dateText =
      date.toLocaleDateString("uk-UA", {
        day: "2-digit",
        month: "2-digit"
      });

    dayBox.innerHTML = `
      <div style="
        font-weight: 700;
        font-size: 17px;
        margin-bottom: 10px;
      ">
        ${days[weekday]} — ${dateText}
      </div>
    `;

    if (!daySchedule || daySchedule.is_day_off) {

      dayBox.innerHTML += `
        <div style="
          padding: 10px;
          border-radius: 8px;
          background: #f3f3f3;
          color: #777;
        ">
          Вихідний
        </div>
      `;

      scheduleBox.appendChild(dayBox);
      continue;
    }

    const startHour =
      Number(daySchedule.start_time.slice(0, 2));

    const endHour =
      Number(daySchedule.end_time.slice(0, 2));

    for (
      let hour = startHour;
      hour < endHour;
      hour++
    ) {

      const time =
        String(hour).padStart(2, "0") + ":00";

      const booking =
        bookings.find(item => {

          const bookingTime =
            String(item.booking_time || "")
              .slice(0, 5);

          return (
            item.booking_date === dateString &&
            bookingTime === time
          );
        });

      const slot = document.createElement("div");

      const busy = Boolean(booking);

      slot.style.cssText = `
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 10px 12px;
        margin-top: 7px;
        border-radius: 8px;
        background: ${busy ? "#ffe1e1" : "#ffffff"};
        border: 1px solid ${busy ? "#e53935" : "#dddddd"};
        color: ${busy ? "#c62828" : "#333333"};
      `;

      slot.innerHTML = `
        <strong>${time}</strong>
        <span style="
          font-weight: 700;
          color: ${busy ? "#d32f2f" : "#555"};
        ">
          ${busy ? "Зайнято" : "Не зайнято"}
        </span>
      `;

      dayBox.appendChild(slot);
    }

    scheduleBox.appendChild(dayBox);
  }

  box.parentElement.appendChild(scheduleBox);
}

/* =========================
   ОТОБРАЖЕНИЕ ЗАЯВОК
========================= */

function renderBookings(data) {

  const box =
    document.getElementById("bookings");


  if (!data.length) {

    box.innerHTML =
      `<div class="empty">
        Заявок поки немає.
      </div>`;

    return;
  }


  box.innerHTML = "";


  data.forEach(
    booking => {

      const card =
        document.createElement("div");

      card.className =
        "booking";


      const status =
        booking.status || "new";


      const time =
        booking.booking_time
          ? String(
              booking.booking_time
            ).slice(0, 5)
          : "—";


      card.innerHTML = `

        <div class="booking-top">

          <div>

            <div class="client">
              ${escapeHtml(
                booking.client_name
              )}
            </div>

            <div class="phone">
              ${escapeHtml(
                booking.phone
              )}
            </div>

          </div>


          <div>

            <div class="
              status
              status-${escapeHtml(status)}
            ">
              ${statusName(status)}
            </div>


            <select
              onchange="
                changeStatus(
                  '${booking.id}',
                  this.value
                )
              "
            >

              <option
                value="new"
                ${status === "new"
                  ? "selected"
                  : ""}
              >
                Нова
              </option>


              <option
                value="confirmed"
                ${status === "confirmed"
                  ? "selected"
                  : ""}
              >
                Підтверджена
              </option>


              <option
                value="completed"
                ${status === "completed"
                  ? "selected"
                  : ""}
              >
                Завершена
              </option>


              <option
                value="cancelled"
                ${status === "cancelled"
                  ? "selected"
                  : ""}
              >
                Скасована
              </option>

            </select>

          </div>

        </div>


        <div class="details">

          <div class="detail">

            <div class="detail-title">
              Послуга
            </div>

            <strong>
              ${escapeHtml(
                booking.service_name ||
                "Не вказана"
              )}
            </strong>

          </div>


          <div class="detail">

            <div class="detail-title">
              Дата
            </div>

            <strong>
              ${escapeHtml(
                booking.booking_date ||
                "—"
              )}
            </strong>

          </div>


          <div class="detail">

            <div class="detail-title">
              Час
            </div>

            <strong>
              ${escapeHtml(time)}
            </strong>

          </div>

        </div>


        ${
          booking.comment
            ? `
              <div class="comment">
                <strong>
                  Коментар:
                </strong>
                <br>
                ${escapeHtml(
                  booking.comment
                )}
              </div>
            `
            : ""
        }

      `;


      box.appendChild(card);

    }
  );
}


/* =========================
   ИЗМЕНЕНИЕ СТАТУСА
========================= */

async function changeStatus(
  id,
  status
) {

  const {
    error
  } =
    await supabaseClient
      .from("bookings")
      .update({

        status: status,

        updated_at:
          new Date()
            .toISOString()

      })
      .eq(
        "id",
        id
      );


  if (error) {

    alert(
      "Не вдалося змінити статус:\n\n" +
      error.message
    );

    return;
  }


  loadBookings();
}


/* =========================
   НАЗВАНИЯ СТАТУСОВ
========================= */

function statusName(status) {

  const names = {

    new:
      "Нова",

    confirmed:
      "Підтверджена",

    completed:
      "Завершена",

    cancelled:
      "Скасована"

  };


  return (
    names[status] ||
    status
  );
}


/* =========================
   ЗАЩИТА HTML
========================= */

function escapeHtml(value) {

  return String(
    value ?? ""
  )
    .replaceAll(
      "&",
      "&amp;"
    )
    .replaceAll(
      "<",
      "&lt;"
    )
    .replaceAll(
      ">",
      "&gt;"
    )
    .replaceAll(
      '"',
      "&quot;"
    )
    .replaceAll(
      "'",
      "&#039;"
    );
}


/* =========================
   СЛЕДИМ ЗА AUTH
========================= */

supabaseClient.auth.onAuthStateChange(
  (_event, session) => {

    if (session) {

      showAdmin();

      loadBookings();

    } else {

      showLogin();

    }

  }
);


/* =========================
   СТАРТ
========================= */

checkAuth();

</script>

</body>
  </html>
