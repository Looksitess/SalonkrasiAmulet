name: Build Amulet Admin Android

on:
  push:
    branches:
      - main
    paths:
      - 'android-admin/**'
      - '.github/workflows/build-android-admin.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: amulet-admin-android-build
  cancel-in-progress: false

jobs:
  build:
    name: Build signed Android app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-admin
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          cache-provider: basic

      - name: Verify Android project files
        shell: bash
        run: |
          set -euo pipefail
          test -f settings.gradle
          test -f build.gradle
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/java/com/looksitess/amuletadmin/MainActivity.java
          echo "Android project files are present."

      - name: Verify protected Play upload key secrets
        id: signing
        shell: bash
        env:
          STORED_KEY_BASE64: ${{ secrets.AMULET_UPLOAD_KEYSTORE_BASE64 }}
          STORED_KEY_PASSWORD: ${{ secrets.AMULET_UPLOAD_KEYSTORE_PASSWORD }}
          STORED_KEY_ALIAS: ${{ secrets.AMULET_UPLOAD_KEY_ALIAS }}
          STORED_PRIVATE_KEY_PASSWORD: ${{ secrets.AMULET_UPLOAD_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$STORED_KEY_BASE64" || -z "$STORED_KEY_PASSWORD" || -z "$STORED_KEY_ALIAS" || -z "$STORED_PRIVATE_KEY_PASSWORD" ]]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Android release package skipped. Configure all four protected AMULET_UPLOAD_KEYSTORE_* Actions secrets to enable signing."
            echo "No signing key will be generated or published by this workflow."
            exit 0
          fi

          KEYSTORE="$RUNNER_TEMP/amulet-upload-key.jks"
          printf '%s' "$STORED_KEY_BASE64" | base64 --decode > "$KEYSTORE"
          test -s "$KEYSTORE"
          keytool -list -keystore "$KEYSTORE" -storepass "$STORED_KEY_PASSWORD" -alias "$STORED_KEY_ALIAS" >/dev/null

          echo "::add-mask::$STORED_KEY_PASSWORD"
          echo "::add-mask::$STORED_PRIVATE_KEY_PASSWORD"
          echo "keystore=$KEYSTORE" >> "$GITHUB_OUTPUT"
          echo "ready=true" >> "$GITHUB_OUTPUT"
          echo "Play upload key loaded and validated from protected Actions secrets."

      - name: Build signed Android App Bundle and APK
        if: steps.signing.outputs.ready == 'true'
        env:
          AMULET_KEYSTORE_PATH: ${{ steps.signing.outputs.keystore }}
          AMULET_KEYSTORE_PASSWORD: ${{ secrets.AMULET_UPLOAD_KEYSTORE_PASSWORD }}
          AMULET_KEY_ALIAS: ${{ secrets.AMULET_UPLOAD_KEY_ALIAS }}
          AMULET_KEY_PASSWORD: ${{ secrets.AMULET_UPLOAD_KEY_PASSWORD }}
        shell: bash
        run: gradle --no-daemon --stacktrace clean bundleRelease assembleRelease

      - name: Prepare app-only download package
        if: steps.signing.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p play-package
          cp app/build/outputs/bundle/release/app-release.aab play-package/Amulet-Admin.aab
          cp app/build/outputs/apk/release/app-release.apk play-package/Amulet-Admin.apk
          cat > play-package/README.txt <<'EOF'
          Amulet Admin signed Android package.

          This package contains the APK and Android App Bundle only.
          The private upload keystore and its passwords are intentionally
          excluded and must remain in protected GitHub Actions secrets.
          EOF

      - name: Upload app-only Android package
        if: steps.signing.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: amulet-admin-play-package
          path: android-admin/play-package/
          if-no-files-found: error
          retention-days: 7

      - name: Upload build reports if build fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: amulet-admin-build-reports
          path: |
            android-admin/app/build/reports/
            android-admin/app/build/outputs/logs/
          if-no-files-found: ignore
          retention-days: 7
