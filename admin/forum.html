<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Амулет — модерація форуму</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#faf8f4;--card:#fffefd;--text:#302c27;--muted:#81796f;--gold:#aa9272;--line:#e9e2d8;--red:#b42318;--green:#177245;--blue:#29445f}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px Arial,sans-serif}.container{max-width:1100px;margin:auto;padding:20px}.panel,.topic,.reply{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:18px;margin-bottom:14px}.header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}.muted{color:var(--muted)}button,.button{border:0;border-radius:9px;padding:10px 14px;background:var(--blue);color:#fff;font-weight:700;cursor:pointer;text-decoration:none}.soft{background:#f0e9de;color:var(--text)}.danger{background:var(--red)}.green{background:var(--green)}.actions{display:flex;gap:8px;flex-wrap:wrap}.topic h3{margin:0 0 7px;font-size:19px}.meta{font-size:12px;color:var(--muted);margin:5px 0 12px}.body{white-space:pre-wrap;overflow-wrap:anywhere;margin:8px 0 14px}.badge{display:inline-block;border-radius:999px;padding:4px 9px;background:#f0e9de;font-size:12px}.badge.hidden{background:#ffe4e2;color:#9b1c14}.reply{margin:9px 0 0;padding:13px;background:#faf8f4}.reply p{white-space:pre-wrap;margin:6px 0}.login{max-width:420px;margin:8vh auto;background:#fff;padding:26px;border-radius:16px}.login input{display:block;width:100%;padding:11px;margin:7px 0 12px;border:1px solid var(--line);border-radius:9px}.message{padding:10px;border-radius:9px;margin:12px 0}.ok{background:#e8f5ec;color:var(--green)}.err{background:#fff0ef;color:var(--red)}.empty{text-align:center;padding:24px;color:var(--muted)}@media(max-width:600px){.container{padding:12px}.panel,.topic{padding:14px}}
</style>
</head>
<body>
<div id="login" class="login" style="display:none"><h1>Модерація форуму</h1><p class="muted">Увійдіть під адміністраторським акаунтом.</p><label>Email</label><input id="email" type="email" autocomplete="username"><label>Пароль</label><input id="password" type="password" autocomplete="current-password"><button style="width:100%" onclick="login()">Увійти</button><div id="loginError"></div></div>
<div id="app" style="display:none"><div class="container">
<div class="header"><div><h1 style="margin:0">Модерація форуму</h1><div class="muted">Керуйте темами й відповідями, приховуйте спам та закривайте обговорення.</div></div><div class="actions"><a class="button soft" href="./index.html">До записів та відгуків</a><a class="button soft" href="../forum.html" target="_blank" rel="noopener">Відкрити форум</a><button class="soft" onclick="loadTopics()">Оновити</button><button class="danger" onclick="logout()">Вийти</button></div></div>
<div id="message"></div><div id="topics"><div class="empty">Завантаження…</div></div>
</div></div>
<script>
const SUPABASE_URL="https://hqbjlvryecmqemmajqyo.supabase.co";
const SUPABASE_KEY="sb_publishable_o4SMwGNId-e5tqfTSrKWfQ_f2Ftn5j7";
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let session=null;
function esc(v){return String(v??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;")}
function message(text,ok){document.getElementById("message").innerHTML=text?'<div class="message '+(ok?"ok":"err")+'">'+esc(text)+'</div>':""}
function loginError(text){const e=document.getElementById("loginError");e.className=text?"message err":"";e.textContent=text||""}
async function route(){const s=await db.auth.getSession();session=s.data.session||null;if(!session){document.getElementById("login").style.display="block";return}const p=await db.from("profiles").select("id,role,is_admin,active").eq("id",session.user.id).maybeSingle();if(p.error||!p.data||!p.data.active||!(p.data.is_admin||p.data.role==="admin")){await db.auth.signOut();document.getElementById("login").style.display="block";loginError("Доступ дозволено лише активному адміністратору.");return}document.getElementById("login").style.display="none";document.getElementById("app").style.display="block";await loadTopics()}
async function login(){loginError("");const email=document.getElementById("email").value.trim(),password=document.getElementById("password").value;if(!email||!password){loginError("Введіть email і пароль.");return}const r=await db.auth.signInWithPassword({email,password});if(r.error){loginError("Не вдалося увійти: "+r.error.message);return}await route()}
async function logout(){await db.auth.signOut();location.reload()}
async function loadTopics(){const box=document.getElementById("topics");box.innerHTML='<div class="empty">Завантаження…</div>';const r=await db.from("forum_topics").select("id,title,category,body,author_name,created_at,updated_at,is_locked,status").order("updated_at",{ascending:false}).limit(200);if(r.error){box.innerHTML='<div class="empty">Не вдалося завантажити теми: '+esc(r.error.message)+'</div>';return}if(!r.data.length){box.innerHTML='<div class="empty">Тем поки немає.</div>';return}const ids=r.data.map(t=>t.id);const pr=await db.from("forum_posts").select("id,topic_id,author_name,body,created_at,status").in("topic_id",ids).order("created_at",{ascending:true}).limit(1000);if(pr.error){box.innerHTML='<div class="empty">Не вдалося завантажити відповіді: '+esc(pr.error.message)+'</div>';return}const posts=pr.data||[];box.innerHTML=r.data.map(t=>{const list=posts.filter(p=>p.topic_id===t.id);return '<article class="topic"><div class="header"><div><span class="badge '+(t.status==="hidden"?"hidden":"")+'">'+(t.status==="hidden"?"Прихована":"Опублікована")+'</span> <span class="badge">'+(t.is_locked?"Закрита":"Відкрита")+'</span> <span class="badge">'+esc(t.category)+'</span><h3 style="margin-top:9px">'+esc(t.title)+'</h3><div class="meta">Автор: '+esc(t.author_name)+' · '+new Date(t.created_at).toLocaleString("uk-UA")+' · Відповідей: '+list.length+'</div></div></div><div class="body">'+esc(t.body)+'</div><div class="actions">'+(t.status==="published"?'<button class="soft" onclick="setTopicStatus(\''+t.id+'\',\'hidden\')">Приховати</button>':'<button class="green" onclick="setTopicStatus(\''+t.id+'\',\'published\')">Опублікувати</button>')+'<button class="soft" onclick="toggleLock(\''+t.id+'\','+(!t.is_locked)+')">'+(t.is_locked?"Відкрити відповіді":"Закрити відповіді")+'</button><button class="danger" onclick="deleteTopic(\''+t.id+'\')">Видалити тему</button></div><details style="margin-top:14px"><summary style="cursor:pointer;font-weight:700">Відповіді ('+list.length+')</summary>'+(list.length?list.map(p=>'<div class="reply"><div><strong>'+esc(p.author_name)+'</strong> <span class="meta">'+new Date(p.created_at).toLocaleString("uk-UA")+'</span> <span class="badge '+(p.status==="hidden"?"hidden":"")+'">'+(p.status==="hidden"?"Прихована":"Опублікована")+'</span></div><p>'+esc(p.body)+'</p><div class="actions">'+(p.status==="published"?'<button class="soft" onclick="setPostStatus(\''+p.id+'\',\'hidden\')">Приховати</button>':'<button class="green" onclick="setPostStatus(\''+p.id+'\',\'published\')">Показати</button>')+'<button class="danger" onclick="deletePost(\''+p.id+'\')">Видалити</button></div></div>').join(""):'<p class="muted">Відповідей поки немає.</p>')+'</details></article>'}).join("")}
async function setTopicStatus(id,status){const r=await db.from("forum_topics").update({status}).eq("id",id);if(r.error){message("Не вдалося змінити статус: "+r.error.message,false);return}message(status==="hidden"?"Тему приховано.":"Тему опубліковано.",true);await loadTopics()}
async function toggleLock(id,locked){const r=await db.from("forum_topics").update({is_locked:locked}).eq("id",id);if(r.error){message("Не вдалося змінити стан теми: "+r.error.message,false);return}message(locked?"Відповіді до теми закрито.":"Відповіді знову дозволені.",true);await loadTopics()}
async function deleteTopic(id){if(!confirm("Видалити тему разом з усіма відповідями? Цю дію не можна скасувати."))return;const r=await db.from("forum_topics").delete().eq("id",id);if(r.error){message("Не вдалося видалити тему: "+r.error.message,false);return}message("Тему та її відповіді видалено.",true);await loadTopics()}
async function setPostStatus(id,status){const r=await db.from("forum_posts").update({status}).eq("id",id);if(r.error){message("Не вдалося змінити відповідь: "+r.error.message,false);return}message(status==="hidden"?"Відповідь приховано.":"Відповідь опубліковано.",true);await loadTopics()}
async function deletePost(id){if(!confirm("Видалити цю відповідь?"))return;const r=await db.from("forum_posts").delete().eq("id",id);if(r.error){message("Не вдалося видалити відповідь: "+r.error.message,false);return}message("Відповідь видалено.",true);await loadTopics()}
route();
</script>
</body>
</html>
