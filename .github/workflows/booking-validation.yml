name: Booking validation and frontend syntax

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/create-booking/**"
      - "supabase/migrations/**"
      - "index.html"
      - "admin/**"
      - "forum.html"
      - "community-reviews.js"
      - "scripts/check-inline-scripts.mjs"
      - ".github/workflows/booking-validation.yml"
  pull_request:
    paths:
      - "supabase/functions/create-booking/**"
      - "supabase/migrations/**"
      - "index.html"
      - "admin/**"
      - "forum.html"
      - "community-reviews.js"
      - "scripts/check-inline-scripts.mjs"
      - ".github/workflows/booking-validation.yml"

permissions:
  contents: read

jobs:
  quality-checks:
    name: Booking tests and JavaScript syntax
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
          cache: true
      - name: Lint Supabase booking function
        run: deno lint supabase/functions/create-booking
      - name: Run booking validation tests
        run: deno test supabase/functions/create-booking/index_test.ts
      - name: Check frontend JavaScript syntax
        run: node scripts/check-inline-scripts.mjs
